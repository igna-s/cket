name: Quantum compiler verification
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  formatting:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install optional formatting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv curl ca-certificates
          bash scripts/setup-format.sh
      - name: Check source and documentation formatting
        run: .deps/format-venv/bin/python scripts/format.py --check
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CC: gcc-11
      CXX: g++-11
    steps:
      - uses: actions/checkout@v4
      - name: Install matching GCC and validation dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-11 g++-11 gcc-11-plugin-dev binutils curl ca-certificates
      - name: Compiler, runtime, user examples and independent validation with sanitizers
        run: bash scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            build/verify-*.log
            build/frontend-failure.*
            build/gcc-version.txt
            build/synthesis-growth.csv
