name: Quantum compiler verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-22.04
    env:
      CC: gcc-11
      CXX: g++-11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: scripts/requirements-validation.txt
      - run: sudo apt-get update && sudo apt-get install -y gcc-11 g++-11 gcc-11-plugin-dev
      - run: python -m pip install -r scripts/requirements-validation.txt
      - run: bash scripts/build.sh
      - run: bash scripts/test.sh | tee build/ci-native.log
      - run: python scripts/fuzz_frontend.py | tee build/ci-frontend.log
      - run: python scripts/benchmark_synthesis.py | tee build/ci-growth.log
      - run: python scripts/validate_qasm.py | tee build/ci-qasm.log
      - run: bash scripts/sanitize-all.sh | tee build/ci-sanitized.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            build/ci-*.log
            build/frontend-failure.*
            build/gcc-version.txt
            build/synthesis-growth.csv
