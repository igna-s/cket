name: Bug report
description: A valid program fails or produces an incorrect result.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal program and command
      description: Include the minimal C or QIR source and the complete reproduction command.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
      description: Include diagnostics, output, or amplitude/probability differences.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: System, gcc --version, g++ --version, cket --version, and Git revision.
      render: text
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Seed, optimization level, resources, QASM, or sanitizer logs.
