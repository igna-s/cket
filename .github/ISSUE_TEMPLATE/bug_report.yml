name: Reporte de error
description: Un programa válido falla o produce un resultado incorrecto.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Programa y comando mínimos
      description: Incluí el C o QIR mínimo y el comando completo para reproducirlo.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado y observado
      description: Incluí el diagnóstico, salida o diferencia de amplitudes/probabilidades.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Sistema, gcc --version, g++ --version, cket --version y revisión de Git.
      render: text
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia adicional
      description: Semilla, optimización, recursos, QASM o registros de sanitizadores.
