name: Security report
description: Report a vulnerability within this private repository.
title: "[Security] "
labels: [security]
body:
  - type: markdown
    attributes:
      value: This report is visible to people with access to the private repository. Omit credentials and sensitive data.
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the minimal C or QIR source, command, and versions used.
      render: text
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Observed impact
      description: Describe the failure and its impact, attaching logs without sensitive data.
    validations:
      required: true
