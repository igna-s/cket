name: Feature request
description: Extend the language, synthesis, composition, or validation.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Show a program or circuit that would benefit from the change.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed contract
      description: Specify required types, ownership, effects, controls, cleanup, and limits.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Propose verifiable results and their relationship to docs/v1-plan.md.
    validations:
      required: true
