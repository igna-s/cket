name: Propuesta de mejora
description: Ampliar el lenguaje, la síntesis, la composición o la validación.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Caso de uso
      description: Mostrá un programa o circuito que se beneficiaría del cambio.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contrato propuesto
      description: Indicá tipos, propiedad, efectos, controles, limpieza y límites necesarios.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: Proponé resultados verificables y la relación con docs/v1-plan.md.
    validations:
      required: true
